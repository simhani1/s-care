spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${LOCAL_MYSQL_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${LOCAL_MYSQL_USER}
    password: ${LOCAL_MYSQL_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_URL}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PWD}
    connection-timeout: 3s
    channel-rpc-timeout: 3s
    requested-heartbeat: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  task:
    scheduling:
      pool:
        size: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org:
      springframework:
        web: DEBUG

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  salt: ${JWT_SALT}
  access:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH}  # Swagger UI에 접근할 URL 경로
  api-docs:
    path: ${SWAGGER_API_DOCS_PATH}

internal:
  api:
    secret: ${INTERNAL_API_SECRET}

## fast API 주소
fast:
  api:
    base-url: ${FAST_API_BASE_URL}
    stress-endpoint: ${STRESS_ENDPOINT}

## FCM 서비스 JSON 위치
fcm:
  key: ${FCM_SERVICE_ACCOUNT_KEY}